  <script>
    const RAW_MARKDOWN = "# \ud83d\udcc8 \u770b\u61c2\u53f0\u80a1\u5927\u6f32\u7684\u300c\u8d85\u524d\u9810\u5831\u7cfb\u7d71\u300d\uff1a\u53f0\u80a1\u9818\u5148\u6307\u6a19\u8207\u300c\u6295\u8cc7 2.0\u300d\u767d\u8a71\u5168\u89e3\u6790\n### \u2500\u2500 \u5c08\u70ba\u9ad8\u4e2d\u751f\u3001\u6295\u8cc7\u65b0\u624b\u8207 65 \u6b72\u9577\u8005\u6253\u9020\u7684\u5c0a\u7235\u767d\u8a71\u64cd\u4f5c\u624b\u518a\u8207\u6307\u6a19\u6df1\u5ea6\u5716\u89e3\n\n> **\ud83d\udca1 \u7d66\u8b80\u8005\u7684\u4e00\u53e5\u8a71\u5c0e\u8b80**\uff1a  \n> \u60f3\u50cf\u4e00\u4e0b\uff0c\u5982\u679c\u4f60\u660e\u5929\u8981\u51fa\u9580\uff0c\u4f60\u662f\u770b\u5929\u7a7a\u7684\u7a4d\u96e8\u96f2\u548c\u6c23\u58d3\u8a08\u4f86\u6c7a\u5b9a\u5e36\u5098\uff1f\u9084\u662f\u7b49\u5927\u96e8\u5df2\u7d93\u628a\u4f60\u6dcb\u6210\u843d\u6e6f\u96de\u4e86\u624d\u885d\u53bb\u8d85\u5546\u8cb7\u5098\uff1f  \n> \u5728\u80a1\u5e02\u88e1\uff0c\u591a\u6578\u4eba\u770b\u96fb\u8996\u65b0\u805e\u548c\u6708\u71df\u6536\u8cb7\u80a1\u7968\uff0c\u5f80\u5f80\u5c31\u50cf\u88ab\u66b4\u96e8\u6dcb\u6fd5\u4e86\u624d\u8cb7\u5098\u3002\u800c\u9019\u5957\u7cfb\u7d71\uff0c\u5c31\u662f\u53f0\u80a1\u7684**\u300c\u6c23\u8c61\u90fd\u535c\u52d2\u96f7\u9054\u300d**\u2014\u2014\u8981\u5728\u884c\u60c5\u5927\u6f32\u6216\u5927\u8dcc\u524d\u7684 **3 \u5230 6 \u500b\u6708**\uff0c\u5c31\u66ff\u6211\u5011\u6e2c\u51fa\u66b4\u98a8\u96e8\u6216\u5927\u6674\u5929\u7684\u5148\u884c\u8a0a\u865f\uff01  \n> \n> \u672c\u624b\u518a\u4e0d\u50c5\u624b\u628a\u624b\u6559\u4f60\u5982\u4f55\u4f7f\u7528 **LINE \u76e4\u5f8c 15 \u79d2\u63a8\u64ad** \u8207 **\u624b\u6a5f 2X \u7279\u5927\u5b57\u5100\u8868\u677f**\uff0c\u66f4\u7528\u6700\u751f\u6d3b\u5316\u7684\u6bd4\u55bb\uff08\u9ad4\u6aa2\u8868\u3001\u8d85\u5e02\u6253\u6298\u3001\u516c\u8eca\u727d\u7e69\u3001\u8fb2\u592b\u56db\u5b63\uff09\uff0c\u70ba\u4f60\u6df1\u5ea6\u89e3\u5256\u5100\u8868\u677f\u4e0a\u7684\u6bcf\u4e00\u500b\u5c08\u6709\u540d\u8a5e\u8207\u5716\u8868\u5bc6\u78bc\uff01\n\n---\n\n## \ud83e\udded \u76ee\u9304\u5c0e\u89bd\n\n1. [\u5f15\u8a00\uff1a\u70ba\u4ec0\u9ebc\u770b\u65b0\u805e\u8207\u8ca1\u5831\u8cb7\u80a1\u7968\u7e3d\u662f\u6162\u534a\u62cd\uff1f](#\u5f15\u8a00\u70ba\u4ec0\u9ebc\u770b\u65b0\u805e\u8207\u8ca1\u5831\u8cb7\u80a1\u7968\u7e3d\u662f\u6162\u534a\u62cd)\n2. [\u7b2c\u4e00\u7bc7\uff1a\u3010\u624b\u6a5f\u5be6\u6230\u6307\u5357\u3011LINE \u901f\u5831\u8207\u96f2\u7aef\u5100\u8868\u677f\u624b\u628a\u624b\u64cd\u4f5c\u6559\u5b78](#\u7b2c\u4e00\u7bc7\u624b\u6a5f\u5be6\u6230\u6307\u5357line-\u901f\u5831\u8207\u96f2\u7aef\u5100\u8868\u677f\u624b\u628a\u624b\u64cd\u4f5c\u6559\u5b78)\n   * 1.1 LINE \u6bcf\u65e5 16:30\u300c15\u79d2\u76e4\u5f8c\u901f\u5831\u300d\u600e\u9ebc\u770b\uff1f\uff08\u4e09\u6b65\u9a5f\u79d2\u6293\u91cd\u9ede\uff09\n   * 1.2 \u9ede\u958b\u516c\u958b\u7db2\u5740\uff1a\u96d9\u5009\u5eab\u7269\u7406\u9694\u96e2\uff08\u70ba\u4ec0\u9ebc\u5b89\u5fc3\u7121\u8cc7\u5b89\u7591\u616e\uff1f\uff09\n   * 1.3 \ud83d\udc75 65 \u6b72\u9577\u8005\u300c2X \u5927\u5b57\u9ad4\u300d\u5207\u63db\u958b\u95dc\uff08\u4e00\u9375\u653e\u5927\u3001\u5b57\u9ad4\u6e05\u6670\u3001\u81ea\u52d5\u8a18\u61b6\uff09\n   * 1.4 \u624b\u6a5f\u62ff\u6cd5\u96d9\u9ad4\u9a57\uff1a\ud83d\udcf1 \u76f4\u7acb\u62ff\u6cd5\uff08\u5927\u5361\u7247\u6d41\uff09vs. \ud83d\udcca \u6a6b\u653e\u62ff\u6cd5\uff08\u5168\u666f\u5bec\u8868\u683c\uff09\n   * 1.5 \u9802\u90e8\u4e94\u5927\u5feb\u6377\u5206\u985e\u6309\u9215\uff08\u4e00\u79d2\u7be9\u51fa\u300c\ud83d\udfe2 \u4fbf\u5b9c\u597d\u7403\u5e36\u300d\uff09\n3. [\u7b2c\u4e8c\u7bc7\uff1a\u3010\u5927\u76e4\u6c23\u8c61\u9810\u5831\u3011\u81ea\u9069\u61c9\u8a18\u5206\u5361\u8207\u56db\u968e\u6bb5\u50b3\u5c0e\u5716\u8868\u6df1\u5ea6\u62c6\u89e3](#\u7b2c\u4e8c\u7bc7\u5927\u76e4\u6c23\u8c61\u9810\u5831\u81ea\u9069\u61c9\u8a18\u5206\u5361\u8207\u56db\u968e\u6bb5\u50b3\u5c0e\u5716\u8868\u6df1\u5ea6\u62c6\u89e3)\n   * 2.1 \u6578\u64da\u6e90\u982d\uff1a\u56db\u5927\u6c34\u7ba1\u4f9b\u61c9\u53f0\u80a1\u6d3b\u6c34\uff08\u7f8e\u80a1\u79d1\u6280\u3001\u5 ce3\u4e0d\u7b97\u8ce0\u300d\uff0c\u751a\u81f3\u7121\u8166\u5411\u4e0b\u6524\u5e73\uff0c\u6700\u5f8c\u5f9e\u5c0f\u5957\u7262\u8b8a\u6210\u8170\u65ac\u65b7\u982d\uff01\n\n### 5.2 \u7cfb\u7d71\u7684\u7d00\u5f8b\u8655\u65b9\uff1a\n1. **\u7372\u5229\u4ea4\u7d66\u50f9\u4f4d\u968e\u68af**\uff1a\u53ea\u8981\u5927\u76e4\u8a18\u5206\u5361\u5728 75 \u5206\u4ee5\u4e0a\u3001\u500b\u80a1\u9084\u5728\u5408\u7406\u50f9\u5340\u9593\uff0c**\u5b89\u5fc3\u7e8c\u62b1\uff0c\u4e0d\u8981\u9810\u8a2d\u7acb\u5834**\uff01\u76f4\u5230\u89f8\u78b0\u300c\u6602\u8cb4\u50f9 (1.2x)\u300d\u624d\u5206\u6279\u8ce3\u3001\u300c\u760b\u72c2\u50f9 (1.4x)\u300d\u624d\u5168\u6578\u6e05\u7a7a\u3002\n2. **\u505c\u640d\u7576\u4f5c\u5916\u79d1\u624b\u8853**\uff1a\u8cb7\u9032\u4efb\u4f55\u80a1\u7968\uff0c\u4e00\u65e6\u8dcc\u7834\u8cb7\u9032\u6210\u672c **`-15%`**\uff0c\u4ee3\u8868\u6211\u5011\u7576\u6642\u770b\u932f\u4e86\u6216\u4e3b\u529b\u5728\u51fa\u8ca8\u3002**\u5fc5\u9808\u7acb\u523b\u57f7\u884c\u5916\u79d1\u624b\u8853\u4e00\u5200\u5207\u9664\uff01** \u7559\u4e0b 85% \u7684\u5065\u5eb7\u672c\u91d1\uff0c\u7b49\u5f85\u5927\u6674\u5929\u91cd\u65b0\u9032\u653b\uff0c\u96a8\u6642\u90fd\u80fd\u518d\u8cfa\u56de\u4f86\uff01\n\n---\n\n## \u7d50\u8a9e\uff1a\u8b93\u5ba2\u89c0\u6578\u64da\u6210\u70ba\u4f60\u7684\u7b2c\u4e8c\u5927\u8166\n\n\u6295\u8cc7\u4e0d\u662f\u78b0\u904b\u6c23\u7684\u8ced\u535a\uff0c\u800c\u662f\u4e00\u9580\u56b4\u8085\u7684**\u300c\u6982\u7387\u3001\u98a8\u96aa\u8207\u60c5\u7dd2\u7ba1\u7406\u300d**\u5de5\u7a0b\u3002\n\n* \u7576\u5e02\u5834\u4e00\u7247\u6a02\u89c0\u55a7\u9b27\u6642\uff0c\u9818\u5148\u6307\u6a19\u6703\u51b7\u975c\u5730\u770b\u8457\u592e\u884c\u6709\u6c92\u6709\u6536\u7e2e\u9280\u6839\uff1b\n* \u7576\u5e02\u5834\u4e00\u7247\u6050\u614c\u770b\u7a7a\u6642\uff0c\u5be6\u9ad4\u51fa\u8ca8\u6578\u64da\u6703\u6084\u6084\u544a\u8a34\u6211\u5011\u8a02\u55ae\u5df2\u7d93\u585e\u6eff\u6e2f\u53e3\uff1b\n* \u7576\u5f37\u52e2\u80a1\u72c2\u98c6\u6642\uff0c\u9632\u8ffd\u9ad8\u6a5f\u5236\u8207\u5b6b\u6176\u9f8d\u4f30\u503c\u6a21\u578b\u6703\u62c9\u4f4f\u6211\u5011\u7684\u97c1\u7e69\uff0c\u4fdd\u8b77\u6211\u5011\u4e0d\u8ffd\u5728\u6700\u5f8c\u4e00\u68d2\uff01\n\n\u73fe\u5728\uff0c\u4f60\u64c1\u6709\u4e86\u6bcf\u5929\u4e0b\u5348 16:30 \u81ea\u52d5\u97ff\u8d77\u7684 **LINE 15 \u79d2\u901f\u5831**\uff0c\u64c1\u6709\u4e86\u5c08\u70ba 65 \u6b72\u9577\u8005\u8a2d\u8a08\u3001\u5b57\u9ad4\u5927\u5169\u500d\u4e14\u624b\u6a5f\u76f4\u7acb\u6a6b\u653e\u90fd\u7121\u6bd4\u9806\u624b\u7684**\u96f2\u7aef\u516c\u958b\u5100\u8868\u677f**\uff0c\u66f4\u5b78\u6703\u4e86\u770b\u61c2\u6bcf\u4e00\u500b\u6578\u503c\u8207\u5716\u8868\u80cc\u5f8c\u7684\u771f\u6b63\u610f\u6db5\u3002\n\n**\u4f60\u770b\u61c2\u4e86\u5929\u5019\u6c23\u8c61\uff0c\u5099\u9f4a\u4e86\u6551\u751f\u5708\uff0c\u9078\u597d\u4e86\u6700\u5f37\u7684\u5343\u91cc\u99ac\uff0c\u66f4\u7cbe\u7b97\u4e86\u6bcf\u4e00\u6a94\u80a1\u7968\u7684\u4fbf\u5b9c\u50f9\u8207\u5408\u7406\u90e8\u4f4d\uff1b\u5269\u4e0b\u7684\uff0c\u5c31\u662f\u76f8\u4fe1\u5ba2\u89c0\u6578\u64da\u8207\u4ea4\u6613\u7d00\u5f8b\uff0c\u512a\u96c5\u5730\u4eab\u53d7\u8907\u5229\u5e36\u4f86\u7684\u8ca1\u5bcc\u7206\u767c\uff01**\n\n---\n*\u6587\u4ef6\u6b78\u6a94\uff1a`docs/\u53f0\u80a1\u9818\u5148\u6307\u6a19\u8207\u6295\u8cc72.0_\u767d\u8a71\u901a\u4fd7\u89e3\u8b80.md`*  \n*\u516c\u958b\u5100\u8868\u677f\u7db2\u5740\uff1a[https://cyc8115832-ctrl.github.io/tw-stock-dashboard/](https://cyc8115832-ctrl.github.io/tw-stock-dashboard/)*  \n*\u8996\u89ba\u898f\u7bc4\uff1a\u9075\u7167\u9ed1\u80cc\u666f\u9ad8\u5c0d\u6bd4\u8a2d\u8a08\u898f\u7bc4 (Dark Mode High-Contrast Standards v2.0)*  \n*\u5c08\u6848\u7248\u672c\uff1aTaiwan Stock Leading Indicators & Investment 2.0 System (\u542b\u5b6b\u6176\u9f8d\u50f9\u503c\u8a55\u50f9\u9ad4\u7cfb)*  \n*\u958b\u6e90\u6388\u6b0a\uff1aMIT License*\n";

    // 初始化 Mermaid
    mermaid.initialize({
      startOnLoad: false,
      theme: 'dark',
      themeVariables: {
        darkMode: true,
        background: '#0B0F19',
        mainBkg: '#1E293B',

      }
    });

    // 渲染 Markdown
    const container = document.getElementById("markdown-container");
    container.innerHTML = marked.parse(RAW_MARKDOWN);

    // 處理 Mermaid 流程圖標籤
    const codeBlocks = container.querySelectorAll("pre code.language-mermaid");
    codeBlocks.forEach((code, idx) => {
      const pre = code.parentElement;
      const mermaidDiv = document.createElement("div");
      mermaidDiv.className = "mermaid flex justify-center my-6 overflow-x-auto p-4 bg-slate-950/80 rounded-xl border border-slate-800";
      mermaidDiv.textContent = code.textContent;
      pre.replaceWith(mermaidDiv);
    });
    mermaid.run();

    // 處理 KaTeX 數學公式
    if (window.renderMathInElement) {
      renderMathInElement(container, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });
    }

    // 65歲長者 2X 大字體開關控制 (同步 index.html 的 localStorage 設定)
    function applyFontPreference() {
      const isNormal = localStorage.getItem("user-font-pref") === "normal";
      const btnText = document.getElementById("seniorToggleText");
      const btn = document.getElementById("seniorToggleBtn");

      if (isNormal) {
        document.documentElement.classList.add("normal-font-mode");
        document.documentElement.classList.remove("senior-mode");
        if (btnText) btnText.textContent = "標準字體 (1X)：已切換";
        if (btn) btn.className = "px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-300 border border-slate-600 font-bold text-sm flex items-center gap-2 active:scale-95 transition-all";
      } else {
        document.documentElement.classList.remove("normal-font-mode");
        document.documentElement.classList.add("senior-mode");
        if (btnText) btnText.textContent = "長者特大字 (2X)：開啟中";
        if (btn) btn.className = "px-3.5 py-1.5 rounded-xl bg-amber-500/20 text-amber-300 border-2 border-amber-400 font-bold text-sm flex items-center gap-2 active:scale-95 transition-all shadow-sm";
      }
    }

    window.toggleSeniorMode = function() {
      const isNormal = document.documentElement.classList.contains("normal-font-mode");
      if (isNormal) {
        localStorage.setItem("user-font-pref", "senior");
      } else {
        localStorage.setItem("user-font-pref", "normal");
      }
      applyFontPreference();
    };

    applyFontPreference();
  </script>
