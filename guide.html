    const RAW_MARKDOWN = "# 台股領先指標與投資2.0：白話操作全書 (v3.0 機構級操作指南)\n\n版本：v4.0 三線分工升級版。整合 **🐇 兔子 × 🐢 烏龜 × 📈 大盤** 三線決策、大白話「三問買進・三問賣出」鐵律、雙軸無矛盾實戰心法與實戰持倉管理。\n\n---\n\n\u003ca id=\"sec-v4-signals\">\u003c/a>\n\n## 🚦 大盤總司令：三線分工 v4（完整訊號定義表）\n\n買個股之前，先花 5 秒看首頁最上面的「三線分工看板」，決定今天**總資金可以放幾成在股市裡**：\n\n1. **三條線各做什麼？（不要再混在一起！）**\n   - **🐇 兔子（油門・每天更新）**：看美股 AI（輝達、費半、雲端四巨頭）、恐慌指數與外資期貨。它反應最快，**負責決定平時要買幾成**（`加速 100% / 回溫 75% / 減速 50% / 煞車 25%`）。\n   - **📈 大盤（路況・每天更新）**：看加權指數有沒有站在月線（20 日線）與季線（60 日線）上。路況好就一次買到位；還沒站上月線就分 3 批慢慢進場。\n   - **🐢 烏龜（安全氣囊・每月更新）**：看 PMI 新訂單、海關出口、外銷訂單、全體營收等台灣實體經濟（慢了約兩個月）。**平時進攻不看烏龜、不會被它卡住；只有當兔子已經踩「煞車」時，烏龜才跳出來決定要留 25%、降 15%，還是清到 0%！**\n\n### 📊 表一：🐇 兔子（日頻油門，0～100 分｜含 ±3 分緩衝帶防洗盤）\n| 狀態訊號 | 精確觸發定義 | 對應持股水位 | 實戰白話意思 |\n| :--- | :--- | :---: | :--- |\n| **加速** | 分數 **≥ 60**，且比 5 天前高（落入 `57` 分以上且續漲即維持） | **100%** | 美股 AI 與籌碼全面衝刺，油門踩滿 |\n| **回溫** | 近 20 日曾跌破 40，現已彈回 **≥ 45** 且**連續 3 天上升** | **75%** | 急跌後止穩轉強，分批把倉位加回來 |\n| **減速** | 分數介於 **40～59** 之間停漲，或從高檔跌破 `57`／停漲 | **50%** | 動能轉平或降溫，先降到半倉觀望 |\n| **煞車** | 分數 **\u003c 40**，**或** 5 天內急跌 **≥ 15 分**（反彈未過 `43` 且未連漲 3 天前維持） | **交由烏龜決定 (25% / 15% / 0%)** | 短線明確轉空／急殺，立刻踩煞車並開啟烏龜安全氣囊 |\n\n### 📊 表二：🐢 烏龜（安全氣囊，0～100 分｜以 50 分 ±3 分與 60 日方向劃分）\n| 狀態訊號 | 水位高低（門檻 50 分） | 與 60 個交易日前相比 | 兔子煞車時給的底倉 | 實戰白話意思 |\n| :--- | :--- | :--- | :---: | :--- |\n| **擴張** | 高檔（**≥ 50**） | **往上或持平** | **25%** | 景氣好且還在走高，兔子只是短震，留 25% 底倉不殺在低點 |\n| **復甦** | 低檔（**\u003c 50**） | **往上或持平** | **25%** | 景氣已在谷底轉升，留 25% 底倉卡位 |\n| **趨緩** | 高檔（**≥ 50**） | **往下** | **15%** | 景氣雖在高檔但開始轉頭向下（歷史上唯一容易出現負報酬的轉折區），降為 15% 輕倉 |\n| **收縮** | 低檔（**\u003c 50**） | **往下** | **0%** | 景氣與動能雙殺，全數清倉避開主跌段 |\n\n### 📊 表三：📈 大盤（路況節奏｜台灣加權指數 60MA 季線與 20MA 月線）\n| 狀態訊號 | 精確技術定義（60MA 季線＋20 天前斜率） | 實戰白話意思 |\n| :--- | :--- | :--- |\n| **多頭** | 加權收盤 **> 60MA（季線）**，且 60MA 比 20 天前**上升** | 中期路況順風，可積極配合兔子進場 |\n| **整理** | 非典型多頭也非典型空頭（例如收盤在季線上但季線走平／下彎，或剛跌破季線但季線仍向上） | 方向未明、震盪換手期，不宜追高 |\n| **空頭** | 加權收盤 **\u003c 60MA（季線）**，且 60MA 比 20 天前**下降** | 中期路況逆風，嚴守低水位與停損 |\n\n- 卡片下方「**站上月線 (20MA)／位於月線 (20MA) 下**」用來確認短線節奏；位於月線下代表短線還沒站穩，不可急著搶反彈。\n\n### 📊 表四：🚦 首頁六大動作燈號總表\n| 兔子 (🐇) | 烏龜 (🐢) | 系統動作燈號 | 建議總持股 | 一句話白話行動 |\n| :--- | :--- | :--- | :---: | :--- |\n| **加速** | 任何狀態 | **🟢 積極買進** | **100%** | 順勢抱滿（烏龜不扣倉） |\n| **回溫** | 任何狀態 | **🟡 分批買進** | **75%** | 資金已先偷跑，勝率高，不必等烏龜翻紅 |\n| **減速** | 任何狀態 | **🟠 持有觀望** | **50%** | 漲勢休息，不追高、留一半現金 |\n| **煞車** | 擴張 ／ 復甦 | **🔴 減碼防守** | **25%** | 景氣沒壞只是短震，守住 25% 底倉不殺在阿呆谷 |\n| **煞車** | **趨緩** | **⛔ 警覺減倉** | **15%** | 高檔轉趨緩＋兔子煞車，降到 15% 防補跌 |\n| **煞車** | 收縮 | **🆘 全面賣出** | **0%** | 景氣與資金雙殺，清空退場避開大空頭 |\n\n---\n\n\u003ca id=\"sec-tortoise-macro\">\u003c/a>\n\n### 🐢 烏龜線實體需求監控 &「國發會紅燈 vs 綠字指標」差別\n- **這個區塊在看什麼？** 它把台灣 6 項月度總經指標（**PMI 新訂單 25%、上市櫃月營收 YoY 25%、外銷訂單 15%、海關出口 12.5%、半導體設備進口 12.5%、M1B-M2 剪刀差 10%**）中的關鍵實體數據攤開給您檢查，這正是上方「烏龜安全氣囊」的原料來源。\n- **💡 為什麼「國發會 41 分紅燈」跟「半導體設備進口 +41% 綠字」看起來顏色相反？**\n  - **國發會「紅燈（38～45 分）」＝ 景氣溫度極旺**（藍燈冷／綠燈穩／紅燈熱），**不是經濟變差**；但因為國發會燈號是落後／同步指標，亮紅燈代表經濟已經好到高檔區，投資上反而是**高檔警戒區、不是便宜買點**。\n  - **下方卡片的「綠字／黃字」＝ 單項動能好壞**：綠色（例如半導體設備進口 `+41.0%`）代表該項動能正向健康；黃色（例如外銷訂單 `\u003c 50` 或 M1B-M2 轉負）代表該項動能偏弱或轉緊。\n\n---\n\n\u003ca id=\"sec-macro-risk\">\u003c/a>\n\n### 🔍 總體宏觀六因子風險監控（在盯什麼風險？）\n這張卡專門盯著 **6 個可能讓股市突然翻臉的總經地雷**（包含美債 10 年期殖利率、VIX 恐慌指數、原油通膨、美元／台幣匯率、國發會景氣對策燈號與聯準會利率環境）：\n- **0 項紅燈**：環境安全，照三線分工正常操作。\n- **1 項紅燈**：偏高警戒，提醒您不要過度開槓桿或追高。\n- **2 項以上紅燈**：代表資金緊縮或通膨／恐慌升溫，系統會把總體環境標為高風險，嚴守減碼紀律。\n\n---\n\n\u003ca id=\"sec-system-health\">\u003c/a>\n\n### 🔍 系統健康度自檢 (System Health) 的意義\n這張卡是整套儀表板的「**開盤前自動體檢表**」，每次產出畫面都會自動交叉核對 6 條防呆規則，**全部亮 `🟢 PASS` 代表今天畫面上的數字可以放心參考，沒有互相打架**：\n1. **① 標籤 vs 籌碼流向**：確保「轉強／好球帶」標籤沒有跟主力資金大賣出矛盾。\n2. **② 宏觀階段 vs 景氣燈號**：核對國發會最新燈號分數與日期是否同步。\n3. **③ 合理價隱含 PE 檢核**：防止極端高本益比（> 60x）的股票誤亮成假便宜買點。\n4. **④ 資料更新新鮮度**：確認行情是最新交易日（T-0）且總經已更新到最新已公布月份。\n5. **⑤ 突破 vs 負乖離約束**：確保還在跌破月線的股票，絕對不會誤報成突破買點。\n6. **⑥ 評分公式閉環**：確認底層分數加總完全吻合，沒有程式漏算或硬寫假數字。\n\n---\n\n## 🧭 第零章：買賣前先停 5 秒！「三問才買、三問才賣」大白話鐵律\n\n> **⚠️ 重要的事說三次：**\n> 1. **不要不三問就買進，不要不三問就賣出！**\n> 2. **不要不三問就買進，不要不三問就賣出！**\n> 3. **不要不三問就買進，不要不三問就賣出！**\n\n很多投資朋友會被套牢，常常是因為只看到「`🟢 好便宜`」或「`🔴💥 營收爆發`」就急著按買進，沒注意大盤總水位或股價其實還在破線往下掉；或者是好不容易買到強勢股，遇到一兩天小震盪就嚇到亂砍賣飛。請先照 **第 0 步（大盤給額度）**，再看懂畫面上的大白話符號與 **「買進三問／賣出三問」**！\n\n---\n\n### 0.0 第 0 步：先看「三線分工 v4」給不給額度（0% 自動鎖倉）\n- **買進前**：先看首頁最上方 **三線分工 v4 建議持股 %**：\n  - 若亮 **🆘 全面賣出（`0%`）**：代表大盤總司令全面鎖倉，系統會**自動鎖住「✅ 三問全過」按鈕（顯示 `🔒 三問全過 (0·大盤0%鎖倉)`）**，禁止新建倉，握好現金最安全。\n  - 若亮 **⛔ 警覺減倉（`15%`）** 或 **🔴 減碼防守（`25%`）**：就算個股通過下方【買進三問】，**帳戶總持股也絕對不能超過 `15%` / `25%`**，僅限輕倉試單。\n- **賣出前**：先核對「目前手上總持股有沒有超過 v4 建議上限」——若超過，優先減碼回到上限內，其餘再對個股【賣出三問】。\n\n---\n\n### 0.1 先用大白話看懂卡片上的「箭頭」與「色燈」\n\n1. **先看股價現在走勢（看有沒有箭頭 `▲ ↗ ▼`）**：\n   - **`🔴▲ 轉強`**：過去 5 天股價有漲（`>= +1%`），而且價格已經**站在月線（過去 20 天大家平均成交價）上面，或只差一點點**，買氣真的回來了。\n   - **`🟡↗ 破線反彈`**：這幾天雖然小反彈上漲，但股價其實**還在月線下面**（或還掛著背離警告）。就像跌倒後稍微站起來半步，還沒站穩起跑線，**隨時可能再跌下去，看就好、別追**。\n   - **`🔵▼ 轉弱` ／ `🔵▼ 價弱(營強)`**：股價正在往下跌或跌破月線。特別是 **`價弱(營強)`**＝「**公司營收看起來很強，但股價卻一直在跌**」，這是最容易騙人去「越跌越買／攤平」的陷阱——看到藍球向下 **嚴禁接刀、嚴禁攤平**！\n   - **`⚪━ 持平`**：價格平平橫盤整理中，先觀察就好。\n\n2. **再看價格貴不貴與資金健康（看圓燈與黃紅警告牌）**：\n   - **`🟢`（便宜位階／資金流入）**：出現在左邊價格標籤（如 `🟢 特價好球帶`）代表「股價打折變便宜」；出現在五維評分格「④ 均線動能／⑤ 主力籌碼」代表「股價站穩月線／大戶資金有買進」。\n   - **`🟠 偏高` ／ `🟣⚠️ 昂貴過熱`**：股價已經漲太貴了，不要再去追高；手上已經有的，可以分批獲利了結。\n   - **`⚠️ 價量營收背離`（黃牌） ／ `⚠️ 資金流出`（紅牌）**：營收明明很好，可是股價卻跌破均線、或資金一直在往外撤——白話意思就是「**有人趁好消息在偷偷賣股票**」！\n\n---\n\n### 0.2 🛒 買進前必問「三問」（3 問全部回答「是」才分批買；只要有 1 問是「否」就忍住！）\n\n按下買進之前，請把手機卡片從上往下對一遍：\n\n1. **【第一問】價格夠便宜了嗎？**\n   - 看卡片左邊的位階標籤：是不是 **`🟢 特價好球帶`、`🟢 便宜好球帶`** 或 **`⚪ 合理偏低區`**？\n   - （如果是 `🟠 偏高`、`🟣⚠️ 昂貴過熱` 或 `⚪ 估值待確認`，回答「否」，跳過不追高。）\n2. **【第二問】股價真的止跌、站穩月線了嗎？**\n   - 看卡片右上角跟右側標籤：有沒有亮 **`🔴▲ 轉強`**＋**`🎯 突破進場 / 📈 多頭確立`**（且五維格第 ④ 格是 **`🟢 站穩月線`**）？\n   - 只要還在 **`🔵▼ 轉弱 / 價弱(營強)`**、**`🟡↗ 破線反彈`** 或 **`⏸️ 築底觀望`／`⏸️ 跌破月線`**，代表股價還沒止跌站穩，回答「否」，**嚴禁接下跌的刀子！**\n3. **【第三問】籌碼乾乾淨淨、沒有大戶在偷跑嗎？**\n   - 卡片上方**完全沒有** **`⚠️ 價量營收背離`**，也沒有 **`⚠️ 資金流出`**（而且總資金／大盤水位還有餘裕）？\n   - 只要掛著任一塊黃牌或紅牌警告，代表主力還在賣，**先等警告牌消失再買！**\n\n> 💡 **懶得一張張肉眼對？系統直接幫你擋！**：在主頁監控池的「🟡💎 好球帶」按鈕正下方，系統已內建 **`✅ 三問全過`** 一鍵篩選鈕——點下去，系統會自動篩出「價格夠便宜 ＋ 站穩月線突破 🔴▲ ＋ 無背離與資金流出」的標的；若顯示 `0 檔`，代表全部股票都還有未過關風險，按兵不動最安全！\n>\n> 💡 **實戰示範（為什麼「便宜＋營收爆發」還是不能買？看 `6274.TWO 台燿`）**：\n> - 第一問（價格打折了嗎）：左邊亮 `🟢 特價好球帶` ＋ `🔴💥 營收爆發` ➔ ✅ **是**\n> - 第二問（站穩月線止跌了嗎）：右上角亮 **`🔵▼ 價弱(營強)`** ＋ `⏸️ 築底觀望`（5日下跌且離月線很遠） ➔ ❌ **否！**\n> - 第三問（沒人在偷賣嗎）：上方掛着 **`⚠️ 價量營收背離`** ＋ **`⚠️ 資金流出`** ➔ ❌ **否！**\n> - **結果：三問只過一問 ➔ 先不動、嚴禁抄底買進，已買進虧損中也嚴禁攤平！**\n\n---\n\n### 0.3 💰 賣出／減碼前必問「三問」（有賺懂得落袋、破線敢防守、好股不亂賣飛！）\n\n手上有持股想賣出、或猶豫該不該砍時，一樣先問完這 3 問再按賣出：\n\n1. **【第一問】是不是已經漲太貴／太過熱了？（決定要不要分批「獲利了結」）**\n   - 股價有沒有漲破 **`🟠 偏高／昂貴價 (1.2x)`** 或亮出 **`🟣⚠️ 昂貴・瘋狂過熱 (1.382x)`**？\n   - 若回答 **「是」** ➔ **逢高分批賣出 1/3～1/2 把獲利放進口袋**，不跟最後一棒賭運氣。\n2. **【第二問】是不是已經跌破月線轉弱、或撞到停損防線？（決定要不要「防守減碼／停損」）**\n   - 先分清楚手上這檔現在是「賺錢」還是「賠錢」：\n     - **還在賺錢，但亮 `🔵▼ 轉弱` 或跌破月線**：啟動**「獲利保衛」**，反彈站不回月線先賣一點保住戰果，絕不抱到由賺變賠！\n     - **已經賠錢，且亮 `🔵▼ 轉弱` 或逼近 `-10% 紀律停損價`**：**嚴禁再加碼攤平！** 反彈無力站回月線時先減碼收回現金；一旦跌破 `-10%` 紀律防守線，果斷停損換股。\n3. **【第三問】會不會只是好股票剛起步的「正常洗盤震盪」？（避免「嚇到賣飛好股」）**\n   - 準備按賣出前先確認：這家公司 **`① 基本面` 健康、`② AI循環` 正常**，股價也**還在月線之上 (`🟢 站穩月線`，沒亮 `🔵▼`)**，卡片**沒有 `⚠️ 價量營收背離 / ⚠️ 資金流出`**，也沒有觸及昂貴價或停損線嗎？\n   - 如果以上都健康、沒破線也沒過貴，只是盤中正常上下晃動 ➔ **回答「是正常震盪」＝ 抱緊不亂賣，讓獲利繼續跑！**\n\n> 📌 **第零章一句話總結（再提醒一次）**：**不要不三問就買進，不要不三問就賣出！** 三問全過才分批買，漲貴或破線／破停損才分批賣，健康不破線就安心續抱。\n\n---\n\n## 🎨 第一章：全系統雙軌高對比色彩與燈號速查表\n\n在純黑背景（`#0B0F19`）環境下，本系統依用途區分為 **兩套並列色彩系統**，請先認清「動能變化球」與「安全風控紅綠燈」的差別，即可 100% 零誤解：\n\n### 1.1 動能變化球與買賣位階（📈 採台股習慣：價格均線優先，紅強藍弱）\n\n| 狀態變化 | 顯示圖示與標籤 | 色碼 (Hex) | 白話操盤意義（一眼秒懂） |\n| :--- | :--- | :--- | :--- |\n| **真・動能轉強** | **🔴▲ 轉強 (火紅)** | `#FF5252` | **價漲＋站穩或貼近 20 日月線**：5 日漲 `>= +1%` 且在月線之上（或下方 2% 內）、無價量背離；與營收爆發徽章 (`🔴🔥💥`) 分開判定，絕不讓好營收掩蓋下跌。 |\n| **破線小反彈** | **🟡↗ 破線反彈** | `#FBBF24` | **還在月線下方的短彈**：5 日雖小漲但仍在月線之下 (`\u003c -2%`) 或帶有 `⚠️ 價量營收背離`，容易彈完再跌，先看別追。 |\n| **維持現狀 / 橫盤** | **⚪━ 持平 (銀白)** | `#CBD5E1` | **橫盤整理中**：價格漲跌未達標；即使營收強勁爆發 (`🔴💥`)，股價未站穩轉強也不顯示紅球。 |\n| **股價轉弱／價弱(營強)** | **🔵▼ 轉弱 / 價弱(營強)** | `#00E5FF` | **股價在跌但可能營收看起來很強**：5 日下跌或跌破月線轉弱；就算基本面營收爆發也會明確標註 `🔵▼ 價弱(營強)`，**嚴禁接刀、嚴禁攤平**！ |\n| **黃金買點 / 安全邊際** | **🟡💎 好球帶** | `#FBBF24` | **股票打折區**：股價跌入孫慶龍便宜價 (`0.8x`) 或特價 (`0.618x`)（需先對完 **第零章「買進三問」** 全過關才出手）！ |\n| **昂貴過熱 / 逢高調節** | **🟣⚠️ 昂貴過熱** | `#C084FC` | **太貴警戒區**：股價漲破昂貴價 (`1.2x`) 或 PE 過熱，嚴禁追高，對完 **第零章「賣出三問」** 分批停利！ |\n\n### 1.3 個股買賣快速檢查（詳見第零章完整圖解）\n\n> 📌 請務必先對完 **第零章「買進三問」與「賣出三問」**（**重要的說三次：不要不三問就買進，不要不三問就賣出！**）。\n> - **買進前**：左邊便宜 (`🟢` 或 `合理偏低`) ＋ 右上真轉強 (`🔴▲`，沒有 `🔵▼`/`🟡↗`) ＋ 沒掛黃紅警告 (`⚠️ 背離`/`⚠️ 流出`)，三問都「是」才買。\n> - **賣出前**：漲太貴 (`🟠 昂貴`/`🟣⚠️ 過熱`) 分批落袋、虧損亮 `🔵▼` 反彈不回月線或破 `-10%` 停損減碼（嚴禁攤平）、健康未破月線則續抱不亂賣飛。\n\n### 1.2 安全體檢、籌碼流向與宏觀風控（🚦 採國際交通號誌：綠安黃警紅險）\n\n在 **「系統健康度自檢」**、**「總體宏觀風險監控」**、**「個股五維體檢／籌碼流向」** 與 **「個股左側安全位階」** 中，色球改採 **交通號誌安全邏輯**（與上方的台股漲跌色不同）：\n\n| 風控／體檢燈號 | 顯示圖示 | 適用區塊與實戰意義 | ⚠️ 常見防呆提醒 |\n| :--- | :--- | :--- | :--- |\n| **安全／通過／流入低估** | **🟢** | 系統 `PASS`、宏觀因子低風險（如 `🟢 溫和擴張與正常防守`、VIX \u003c 20）、主力資金流入、個股進入 `🟢 特價/便宜好球帶`。 | 這裡的「綠」是**健康與安全**，不是台股的下跌！ |\n| **偏高警戒注意** | **🟡** | 總經風險逼近紅燈門檻（例如美債 10Y 殖利率 `🟡 4.99%` 逼近 `5.0%` 警戒線）。 | **⚠️ 總經區 `🟡` 代表接近警戒注意，絕非「🟡💎 便宜好球帶」！** |\n| **風險警報／流出／泡沫** | **🔴**（無▲▼） | 宏觀觸發緊縮紅燈（故 `0項紅燈` ＝環境安全）、籌碼 `🔴 資金流出`、個股 `🔴 瘋狂過熱區`。 | 唯有帶 `▲▼` 或 `🔥💥`（`🔴▲`、`🔴🔥`）才代表股價與營收轉強；另「國發會紅燈 41 分」係台灣景氣熱絡指標。 |\n\n> 👀 **一秒區分口訣**：看圖先看符號——帶 **`▲▼` / `🔥💥` / `💎⚠️`** 是「股價與買賣動作球」（紅強藍弱）；沒帶上下箭頭的「體檢、宏觀風控、籌碼進出與左側估值」是「安全交通燈」（綠安、黃警、紅險）。\n\n---\n\n## 🧭 第二章：為什麼「美股 AI 佔 55%」才是真正的領先指標？\n\n台灣科技產業本質上是全球 AI 伺服器與半導體的下游代工重鎮。\n- **美國科技巨頭（NVIDIA、微軟、Google、Meta、AWS）是「因」**：他們下達 AI 晶片與伺服器資本支出訂單。\n- **台灣海關出口與工業生產是「果」**：台灣廠商接單、備料、生產到報關出貨，通常存在 **2 到 3 個月的時間落後**。\n\n因此，v3.0 系統將 **美股 AI 核心算力（35%）＋ 美國總經流動性（20%）合占 55% 絕對主導權**，以每日即時行情打破傳統政府月報滯後性：\n1. **Stage 1 (35分 · 🇺🇸 美國 AI 核心源頭)**：NVIDIA 60日動能、北美 4 大 CSP 雲端巨頭均線站上比例、費城半導體 SOX 均線突破。\n2. **Stage 2 (25分 · 🇺🇸 美國總經 ＋ 🇹🇼 台灣上游擴產)**：NASDAQ趨勢、美債10Y-2Y利差、VIX、台灣半導體設備進口 YoY、外銷訂單動向。\n3. **Stage 3 (25分 · 🇹🇼 實體出貨與營收改善)**：海關出口 YoY、工業生產、銅價 (Dr. Copper)。\n4. **Stage 4 (15~20分 · 🇹🇼 台股量價與籌碼確認)**：台股大盤量能、相對全球強弱。\n\n---\n\n## 🎯 第三章：破除矛盾！「景氣趨勢 × 個股好球帶」雙軸實戰操盤法\n\n為什麼以前「景氣分數 70 分，持股建議 75%」，買進卻常常買在高點？為什麼分數掉到低點時，反而是股價最便宜的時刻？\n\nv3.0 系統徹底分開指導 **「空手新資金」** 與 **「手上已有部位者」**：\n\n| 市場象限 | 景氣分數 vs 股價位階 | 👤 給空手／新資金的指引 | 💼 給已持倉者的指引 |\n| :--- | :--- | :--- | :--- |\n| **🔴 象限二：多頭主升高檔期** | 景氣 60~75+ 分，多數個股漲多 | **❌ 嚴禁追高！買黑不買紅**\u003cbr/>僅鎖定尚在「🟡好球帶/合理中樞」個股；若無便宜貨則握牢現金等拉回。 | **續抱上限 75%**\u003cbr/>讓利潤奔跑！股價觸及「🟣昂貴過熱價」才分批停利。 |\n| **💎 象限四：多頭急跌黃金坑** | 短期恐慌大跌，大量個股跌入🟡好球帶 | **🎯 啟動左側逢低買進！**\u003cbr/>只要美股 AI 基本面未壞，動用 30%~50% 資金大膽分批布局🟡好球帶。 | **絕不砍在最低點！**\u003cbr/>基本面健康時切勿恐慌殺低，嚴守成本 -10% 防守線即可。 |\n| **🌱 象限一：股價未行・指標先行** | 大盤仍在底部盤整，但美股 AI 指標率先勾頭 (底背離) | **🌟 最佳甜蜜進場點！**\u003cbr/>領先大盤 1~2 季起跑，積極建倉。 | **持股續抱，耐心等待主升段發動。** |\n| **🛡️ 象限三：真・基本面衰退** | 實體訂單連續衰退 ＋ 美股 AI 巨頭跌破年線 | **持幣觀望，保留 80%~100% 現金。** | **果斷執行停損與減碼，不心存僥倖。** |\n\n---\n\n## 🔥 第四章：孫慶龍五價位與「月營收爆發雙雷達」\n\n本系統全面移除容易失真的季報前瞻猜測，回歸 100% 官方驗證的真實月營收動能：\n- **孫慶龍黃金分割五價位**：\n  - **特價 (0.618x)** ➔ **便宜價 (0.800x)** ➔ **合理價 (1.000x)** ➔ **昂貴價 (1.200x)** ➔ **瘋狂價 (1.382x)**\n- **月營收爆發雙勳章**：\n  - **`🔴🔥 營收連3月成長`**：近 3 個月營收連續月增或年增率持續上升，代表訂單產能滿載。\n  - **`🔴💥 連2月營收>30%爆發`**：近 2 個月營收 YoY 均突破 30% 大關，強烈吸引法人買盤！\n- **關鍵時程提醒**：每月 1～10 號（營收開獎）與季報法說會期間，系統自動標註提醒，注意估值重錨。\n\n---\n\n## 💼 第五章：我的持倉管理與「轉弱未脫手」處置指南\n\n升級後的分頁提供專屬個人持倉互動管理（資料安全儲存於瀏覽器 本機 `localStorage`，不外洩）：\n1. **輸入與增減**：輸入持有股數與成本均價，支援 **`➕加碼買進`**（自動精算加權成本）、**`➖部分減碼`** 與 **`🗑️賣出即刪`**。\n2. **到價提醒**：預設以 **「孫慶龍昂貴價 (1.2x)」** 作為停利目標，**「成本 -10%」** 作為紀律防守價。現價達標即跳出醒目通知。\n3. **已轉弱 (`🔵▼`) 但尚未脫手處理劇本**：\n   - **若目前帳面仍獲利**：系統亮出 **`🟡獲利保衛提醒`**，建議逢高分批獲利入袋，切勿抱到由賺轉賠！\n   - **若目前帳面虧損**：系統亮出 **`🔵反彈減碼提醒`**，嚴禁攤平加碼！反彈至均線優先減碼換股，若跌破防守價務必果斷停損。\n\n---\n\n## 📡 第六章：AI 產業週滾動動能與新興產業擴充\n\n- **週滾動動能評分 (0~100)**：結合週價量資金流 (40%) ＋ 月營收真實爆發力 (40%) ＋ 產業週期安全閥 (20%)，每週自動重排 Top 5 強勢產業。\n- **4 大新興 AI 潛力產業**：\n  1. **先進封裝設備耗材與探針卡 (FOPLP/玻璃基板)**（代表：旺矽、穎崴、家登、中砂）\n  2. **人形機器人與實體 AI (Physical AI & Robotics)**（代表：上銀、亞光、台灣精銳、所羅門）\n  3. **邊緣 AI 終端與工業 AI (Edge AI / AI PC)**（代表：研華、華碩、瑞昱）\n  4. **AI 軟體代理與主權雲資安**（代表：零壹、精誠、安碁資訊）\n- **股池汰弱留強看板**：系統自動比對核心池中趨弱標的（建議減碼換股）與新興預備隊中的潛力新星（建議納入觀察）。\n\n---\n\n## 📈 第七章：走勢對照圖讀法與「近三個月動向」判讀指南\n\n在「📊 大盤趨勢與先行指標」分頁中，走勢對照圖採用 **雙 Y 軸設計**，並於圖表正下方自動演算「近三個月走勢判斷、分析與說明」：\n\n1. **雙軸刻度防誤判**：\n   - **青線（自適應記分卡總分）**：對應圖表 **右側刻度（0～100 分）**。\n   - **深藍線（台股加權指數月 K）**：對應圖表 **左側刻度（指數點數）**；圖面捲動至最右側最新月份時，左側軸位於左方捲軸外，因此藍線貼近畫面上方只代表指數位於近年相對高檔，**不是 90～100 分**。\n2. **先蹲後跳 vs 高檔背離的判讀重點**：\n   - 當藍線維持高檔或上漲，而青線一度急降回測 `40～59` 警戒區後再 V 型勾起回到 `60+`（例如 `2026-07 ➔ 08 ➔ 09` 由 `74.0 ➔ 57.0 ➔ 67.0`），代表短期宏觀／費半雜音曾引發「指數彈、指標跌」警戒，但美股 AI 動能隨後重新確認接棒。\n   - 後續追蹤分水嶺：青線站上 **75 分** 且傳統宏觀轉正 ＝ 多頭擴散；若跌破 **60 分（或 50 分熄燈線）** ＝ 警覺背離、依研究規則收縮水位（註：歷史觀察圖與規則尚未通過歷史可得資料及樣本外核驗，不構成投資建議）。\n";

      const NAV_STATE_KEY = "TSLI_NAV_STATE_V1";
      const FROM_GUIDE_KEY = "TSLI_FROM_GUIDE_V1";
      const GUIDE_SCROLL_KEY = "TSLI_GUIDE_SCROLL_V1";

      function resolveReturnUrl() {
        try {
          const raw = sessionStorage.getItem(NAV_STATE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed.dashboardUrl === "string") {
              const u = new URL(parsed.dashboardUrl, window.location.href);
              if (u.origin === window.location.origin && (u.pathname.endsWith("index.html") || u.pathname.endsWith("/"))) {
                return u.href;
              }
            }
          }
        } catch (e) {}
        return "index.html";
      }

      const returnUrl = resolveReturnUrl();
      let fromTabLabel = "";
      try {
        const rawNav = sessionStorage.getItem(NAV_STATE_KEY);
        if (rawNav) {
          const navObj = JSON.parse(rawNav);
          if (navObj && navObj.activeTab === "analysis") fromTabLabel = "返回原處（趨勢頁）";
          else if (navObj && navObj.activeTab === "overview") fromTabLabel = "返回原處（主頁）";
        }
      } catch (e) {}
      document.querySelectorAll('a[data-return-dashboard="1"]').forEach(link => {
        link.setAttribute("href", returnUrl);
        if (fromTabLabel) {
          const spans = link.querySelectorAll("span");
          spans.forEach(sp => {
            if (sp.textContent && sp.textContent.includes("返回")) sp.textContent = fromTabLabel;
          });
        }
        link.addEventListener("click", () => {
          try {
            sessionStorage.setItem(FROM_GUIDE_KEY, "1");
            sessionStorage.setItem(GUIDE_SCROLL_KEY, String(Math.max(0, Math.round(window.scrollY || 0))));
          } catch (e) {}
        });
      });

      document.querySelectorAll('a[data-scroll-top="1"]').forEach(link => {
        link.addEventListener("click", () => {
          try { sessionStorage.removeItem(GUIDE_SCROLL_KEY); } catch (e) {}
        });
      });

      let guideSaveTimer = null;
      window.addEventListener("scroll", () => {
        clearTimeout(guideSaveTimer);
        guideSaveTimer = setTimeout(() => {
          try {
            sessionStorage.setItem(GUIDE_SCROLL_KEY, String(Math.max(0, Math.round(window.scrollY || 0))));
          } catch (e) {}
        }, 200);
      }, { passive: true });

      window.addEventListener("pagehide", () => {
        try {
          sessionStorage.setItem(GUIDE_SCROLL_KEY, String(Math.max(0, Math.round(window.scrollY || 0))));
        } catch (e) {}
      });

      try {
        if (window.location.hash) {
          const targetId = decodeURIComponent(window.location.hash.slice(1));
          const targetEl = document.getElementById(targetId);
          if (targetEl) {
            requestAnimationFrame(() => {
              targetEl.scrollIntoView({ behavior: "auto", block: "start" });
            });
          }
        } else {
          const savedY = Number(sessionStorage.getItem(GUIDE_SCROLL_KEY) || 0);
          if (Number.isFinite(savedY) && savedY > 60) {
            document.documentElement.style.scrollBehavior = "auto";
            requestAnimationFrame(() => {
              window.scrollTo(0, savedY);
              setTimeout(() => { document.documentElement.style.scrollBehavior = ""; }, 0);
            });
          }
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
