    const RAW_MARKDOWN = "# 台股領先指標與投資2.0：白話操作手冊\n\n版本：2026-10-14獨立查核版。歷史手冊已封存，不能當成目前行情或績效證明。\n\n## 一、先看資料，再看分數\n\n這個系統用全球市場、台灣景氣、企業基本面和價格動能四個階段整理研究資訊。分數是人工設定的研究規則，不是市場上漲的機率，也不是獲利保證。\n\n「待核實」表示來源、期間、公告時間或股數口徑仍不足。它不代表零分、不代表低風險，也不表示你必須出售既有持股。沒有資料資格時，首頁分數和建議倉位顯示N/A或待核實。\n\n## 二、四階段與研究倉位\n\n研究分數為四階段加總，再加AI加成，最高100分。傳統模式階段上限為30／25／25／20；AI擴張模式為35／20／25／20，畫面採快照列出的實際上限。\n\n| 分數 | 研究狀態 | 模型倉位 |\n|---|---|---|\n| 小於40 | 觀望冰凍 | 0% |\n| 40至不足60 | 轉折警戒 | 50% |\n| 60至不足75 | 景氣確認 | 75% |\n| 至少75 | 主升作多 | 100% |\n\n宏觀第二階段不足上限40%時，模型持股上限降為75%。前期至少60分而本期跌破50分，或前期至少60分且全球第一階段熄燈，觸發研究退場0%。缺來源時不提供這些操作數字。實際部位還要依持倉成本、風險承受度和資金需求決定。\n\n## 三、先找公司，再看價格與時機\n\n核心與ETF重疊名單是研究股池；納入名單不代表通過財務品質或便宜價驗收。先核對營收、獲利與來源，再查看估值情境，最後看價格動能。\n\nPER的60日市場倍數只能提供市場參考，不能證明獨立內在價值。PSR人工倍數是營收估值情境，不能假稱歷史價格河流。PSR切換研究門檻為三月營收年增至少30%，還須符合產業及獲利條件。人工未來EPS不稱為法人共識。\n\nCMF只是價格與成交量衍生的資金流估計，不是實際外資或主力持倉。量能交易範圍未核實時不作買賣結論。\n\n## 四、季報與前瞻EPS\n\n單季EPS遇配股或分割可能股數基準不同，不能直接相加。系統要求官方財報證據、歸屬普通股股東盈餘、加權平均股數及共同股數基準，才能計算四季EPS；EPS加權平均股數不同於PSR期末流通股數。\n\n前瞻情境必須有三個已公告月份的營收與官方證據，逐月合計後乘歷史四季營收加權淨利率，再估計新季度盈餘。滾動四季是移除去年同季、加入新季，不是隨便扣第一筆資料。虧損仍顯示負EPS，不設正數下限。\n\n新季股數沿用最近核實的加權平均股數，屬於假設，需追蹤配股與增減資。歷史淨利率高低區間是情境範圍，不是統計信賴區間。估值倍數待核實時，情境價格N/A；季報已公告時撤下推估，改看實績。\n\n## 五、回測能說什麼\n\n新的逐日帳本保留期初資金與跨月持倉報酬，月末訊號於下一交易日收盤執行，排名只用訊號日前資訊。買賣手續費分別依金額扣除，交易稅只扣賣出；缺持倉行情直接拒算，不能填成零報酬。\n\n最大回撤用逐日淨值；月報酬用於月勝率及Sharpe。沒有回撤時Calmar是N/A，不是巨大績效值。歷史股池、公告時間、除權息與股息仍待核實，尚未完成樣本外驗證，因此舊累積報酬、Alpha及波段成功率已停止展示。\n\n領先判斷看事後識別谷底前24個月最近的新轉正；谷底後轉正不能算領先。缺完整觀察窗不放入成功率；假訊號須有完整六個未來月份。小樣本即使全勝，Wilson區間仍保留不確定性。這些是研究統計，不是即時交易回報。\n\n## 六、公告與更新\n\n資料期間、公告日期、取得時間是三件不同的事。某月營收或某季財報的期末日期，不等於當天就能知道數字。以每家公司或官方機關實際公告為準，不用固定日曆把尚未公布資料提前放入回測。\n\n目前宏觀六因子缺逐筆來源資格，顯示N/A；不把未知當低風險。快照具有輸入檔雜湊與生成時間，網頁與預覽訊息使用同一份內容；前端不重新判定分數和持股。\n\n`--dry-run`只讀快取與印出預覽，沒有送出訊息或覆寫正式網頁。正式推播與部署在資料驗收未完成前暫停；force選項不能略過。發送成功的管道才去重，失敗可重試；發送中崩潰的紀錄須核對，不自動重送。外部平台未提供冪等鍵時，無法保證網路中斷下的絕對一次送達。\n\n## 資料與查核來源\n\n- [FinMind基本面資料契約](https://finmind.github.io/tutor/TaiwanMarket/Fundamental/)\n- [IFRS IAS 33](https://www.ifrs.org/issued-standards/list-of-standards/ias-33-earnings-per-share.html/)\n- 專案內`docs/audit_20261013/整體查核報告與修正計畫.md`與`docs/audit_20261014/`。\n\n本版沒有宣稱正式資料、預測能力或全系統驗收完成。\n";

    // 65歲長者 2X 大字體開關控制 (同步 index.html 的 localStorage 設定)
    function applyFontPreference() {
      const isNormal = localStorage.getItem("user-font-pref") === "normal";
      const btnText = document.getElementById("seniorToggleText");
      const btn = document.getElementById("seniorToggleBtn");

      if (isNormal) {
        document.documentElement.classList.add("normal-font-mode");
        document.documentElement.classList.remove("senior-mode");
        if (btnText) btnText.textContent = "標準字體 (1X)：已切換";
        if (btn) btn.className = "px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-300 border border-slate-600 font-bold text-sm flex items-center gap-2 active:scale-95 transition-all";
      } else {
        document.documentElement.classList.remove("normal-font-mode");
        document.documentElement.classList.add("senior-mode");
        if (btnText) btnText.textContent = "長者特大字 (2X)：開啟中";
        if (btn) btn.className = "px-3.5 py-1.5 rounded-xl bg-amber-500/20 text-amber-300 border-2 border-amber-400 font-bold text-sm flex items-center gap-2 active:scale-95 transition-all shadow-sm";
      }
    }

    window.toggleSeniorMode = function() {
      const isNormal = document.documentElement.classList.contains("normal-font-mode");
      if (isNormal) {
        localStorage.setItem("user-font-pref", "senior");
      } else {
        localStorage.setItem("user-font-pref", "normal");
      }
      applyFontPreference();
    };

    applyFontPreference();
  </script>
