動手前拉開的多頭保護傘 |\n\n---\n\n### 2.2 核心指標 1：自適應綜合評分 (SCORE 67.0) 閉環公式與 75% 持股水位\n\n在最新 v2.4 系統中，總分全面實現**數學閉環**，徹底杜絕舊版分數打架：\n\n$$\\mathbf{FinalScore (67.0)} = \\mathbf{BaseScore (62.0)} + \\mathbf{AI\\_Boost (+5.0)}$$\n\n其中基礎評分來自四階段真實得分：\n$$BaseScore = S_1(25) + S_2(7) + S_3(23) + S_4(7) = 62.0 \\text{ 分}$$\n\n> 💉 **生活化比喻：普通體檢 62 分，打了「AI 雲端巨頭資本支出維他命」升至 67 分！**  \n> * **基礎分 62.0 分**：台灣傳統經濟傳導需要時間發酵，目前傳統指標拿到 62 分的穩健成績。  \n> * **AI 循環加成 +5.0 分**：微軟、Google、Meta、亞馬遜四大巨頭 2026 年資本支出維持強勁擴張，為台灣半導體注入源頭動能。  \n> * **客觀風控鐵律**：因宏觀景氣階段得分率僅 $7/20 = 35\\%$（低於 40% 警戒線），系統嚴格**禁止使用「全面爆發」或「100% 滿倉」等躁進字眼**，客觀判定為：**「⚪ 景氣確認期，建議持股水位 75%」**。\n\n#### 🚦 四大總司令燈號與持股水位映射表：\n* 🚀 **75 ~ 100 分【主升全面擴張】(電光青綠燈)**：建議持股水位 **100%**。\n* ⚪ **60 ~ 74 分【景氣確認期】(翡翠綠燈)**：**【當前現狀 67.0 分】**，建議持股水位明確映射為 **`75%`**！\n* 🟡 **40 ~ 59 分【警戒震盪期】(琥珀黃燈)**：水流不穩，建議持股壓降至 **50%**。\n* 🔴 **0 ~ 39 分【冰凍退場期】(亮珊瑚紅燈)**：市場大失血，系統強制指令**「0% ~ 30% 或現金空倉」**！\n\n---\n\n### 2.3 核心指標 2：四階段傳導流水線（因果邏輯關係）\n\n經濟世界的運作不是隨機亂跳的，它就像**一條嚴謹精密的工廠流水線**：\n\n```mermaid\n%%{init: {'theme': 'dark', 'themeVariables': { 'darkMode': true, 'background': '#0B0F19', 'mainBkg': '#1E293B', 'lineColor': '#38BDF8', 'textColor': '#FFFFFF', 'edgeLabelBackground': '#0B0F19' }}}%%\nflowchart LR\n    S1[\"🌊 第1階段：全球科技先行<br>★ 得分 25/35 (71%)<br>(費半/輝達/CSP資本支出)\"] \n    --> S2[\"🏦 第2階段：宏觀景氣復甦<br>★ 得分 7/20 (35%)<br>(設備進口+34.8%/外銷延遲)\"] \n    --> S3[\"🚢 第3階段：實體出貨改善<br>★ 得分 23/25 (92%)<br>(海關資通訊出貨破紀錄)\"] \n    --> S4[\"🚀 第4階段：籌碼行情噴出<br>★ 得分 7/20 (35%)<br>(成交量增/外資期貨壓盤)\"]\n```\n\n---\n\n### 2.4 圖表深度導讀 1：【雙軸對照走勢圖】（加權指數 vs. 記分卡）\n\n```\n[ 左軸：台灣加權指數 (點數) ]                              [ 右軸：記分卡分數 (0~100) ]\n        ▲                                                          ▲\n 24,000 ┼                                                  100 ┼──────── 75分【主升擴張線】\n        │               /~~~~~~大盤股價曲線 (實線)                  │\n 18,000 ┼         /\\   /                                    60 ┼-------- 60分【景氣確認線】(當前67分)\n        │  /\\    /  \\ /                                        │\n 12,000 ┼─/──\\ % (阻斷上限)`**。\n  3. 前端「系統健康檢查③」動態比對，真實亮起 `⚠️ WARN` 警示，落實機構級風控。\n\n---\n\n### 3.5 核心指標 7：安全邊際 (MoS%)──買股票有沒有打折？\n\n$$\\text{安全邊際 (MoS)} = \\frac{\\text{合理價} - \\text{當前股價}}{\\text{合理價}} \\times 100\\%$$\n\n* 🟢 **MoS ≥ +10%【深度打折好球帶】**：現價大幅低於合理價，具備充足防守墊。\n* ⚪ **0% ≤ MoS < +10%【合理平價區】**：價格公允，穩健持有。\n* 🟡 **-20% ≤ MoS < 0%【微幅溢價區】**：不追高，可續抱。\n* 🔴 **MoS < -20%【嚴重溢價高估】**：禁止低接，嚴控風險。\n\n---\n\n### 3.6 核心指標 8：保守底價 (Floor Value)──落水時的鋼底救生圈\n\n$$\\text{保守底價} = \\text{近 4 季白紙黑字已實現 EPS 合計} \\times 15 \\text{ 倍穩健本益比}$$\n（若是 PSR 模式，則以近 4 季白紙黑字 SPS 合計乘以保守 PSR 倍數推算。）\n\n---\n\n### 3.7 核心指標 9：PEG (本益成長比)──彼得林區的尋寶神針\n\n$$\\text{PEG} = \\frac{\\text{滾動本益比 (PE)}}{\\text{未來 3 年預估 EPS 複合年成長率 (G)}}$$\n* 🟢 **PEG < 1.0【極度物美價廉】**：成長速度遠大於本益比，超級潛力股。\n* ⚪ **1.0 ≤ PEG ≤ 2.0【合理公允】**。\n* 🔴 **PEG > 2.0【過度透支未來】**。\n\n---\n\n### 3.8 核心指標 10：右側動能突破風控鐵律（負乖離突破禁令與杜絕 -0.0%）\n\n* **月線負乖離突破禁令**：任何標的只要月線乖離率 **`Bias20 ≤ 0.0%`**（代表股價跌破月線或月線之下整理），訊號引擎**硬性禁止判定為「🎯 突破進場」或「🟢 最佳買點」**，一律強制歸類為 `⏸️ 回測整理` 或 `⏸️ 築底觀望`！\n* **順勢操作標註**：當安全邊際 MoS < 0（股價高於合理價）時，若均線多頭突破，系統僅標註「📈 順勢突破 / 順勢操作」，絕不混淆為價值型低估買點。\n* **杜絕 `-0.0%`**：當乖離率絕對值小於 0.05% 時，系統強制歸零為 `0.0%`，文案顯示為 `月線持平 (0.0%)，等待方向確認`，徹底消滅負零幽靈。\n\n---\n\n## 第四篇：【最新 20 檔名單與操作指引】一眼看出好球帶與合適部位\n\n我們嚴格鎖定台股 20 檔最具備 AI 爆發力的核心標的（納入 IC 設計龍頭**聯發科 2454** 與銅箔基板龍頭**台光電 2383**）。  \n在儀表板與以下總表，**一律以安全邊際 MoS% 由大到小降序排列**：\n\n### 🎯 20 檔核心監控名單：AI 投資 2.0 估值矩陣全景戰報 (2026-09-29 最新收盤實績)\n\n| 排序 | 標的代號 / 名稱 | 子產業分類 | 最新收盤 | 保守底價 | 便宜價 (0.8x) | 合理價 (1.0x) | 昂貴價 (1.2x) | 安全邊際 (MoS%) | 估值模式 | 隱含PE | 孫慶龍位階色標 | 建議合理部位 |\n| :---: | :--- | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: |\n| 🥇 **#1** | **訊芯-KY (6451.TW)** | 矽光子與CPO光通訊 | **$416.0** | $366.1 | $501.76 | $623.30 | $874.49 | **`+33.3%`** 🟢 | PSR | 54.2x | 🟢 便宜低估區 | **30%~50%** (謹慎分批) |\n| 🥈 **#2** | **士電 (1503.TW)** | 重電與電網基礎設施 | **$194.5** | $102.0 | $170.41 | $213.01 | $255.61 | **`+8.7%`** 🟢 | PER | 22.4x | ⚪ 合理偏低區 | **50%** (穩健持有) |\n| 🥉 **#3** | **英業達 (2356.TW)** | AI伺服器代工與機櫃 | **$59.5** | $34.5 | $51.17 | $63.96 |         document.documentElement.classList.remove("senior-mode");
        if (btnText) btnText.textContent = "標準字體 (1X)：已切換";
        if (btn) btn.className = "px-3.5 py-1.5 rounded-xl bg-slate-800 text-slate-300 border border-slate-600 font-bold text-sm flex items-center gap-2 active:scale-95 transition-all";
      } else {
        document.documentElement.classList.remove("normal-font-mode");
        document.documentElement.classList.add("senior-mode");
        if (btnText) btnText.textContent = "長者特大字 (2X)：開啟中";
        if (btn) btn.className = "px-3.5 py-1.5 rounded-xl bg-amber-500/20 text-amber-300 border-2 border-amber-400 font-bold text-sm flex items-center gap-2 active:scale-95 transition-all shadow-sm";
      }
    }

    window.toggleSeniorMode = function() {
      const isNormal = document.documentElement.classList.contains("normal-font-mode");
      if (isNormal) {
        localStorage.setItem("user-font-pref", "senior");
      } else {
        localStorage.setItem("user-font-pref", "normal");
      }
      applyFontPreference();
    };

    applyFontPreference();
  </script>
</body>
</html>
